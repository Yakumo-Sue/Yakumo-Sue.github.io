<rect x="824" y="259" width="296" height="58" rx="10" fill="#E9F2F1" stroke="#C8DDDC" stroke-width="1"/>
<text x="849" y="297" fill="#1D535A" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="600" text-anchor="start" letter-spacing="0">/(root)</text>
<rect x="982" y="381" width="138" height="54" rx="10" fill="#2D8D88" stroke="none" stroke-width="1"/>
<text x="1051" y="416" fill="#FFFFFF" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="0">Save</text>
<text x="90" y="411" fill="#596F77" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="500" text-anchor="start" letter-spacing="0">先由 deploy.yml 创建 gh-pages 分支，再选分支和根目录。</text>
<text x="59" y="545" fill="#517E84" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="500" text-anchor="start" letter-spacing="0">如果改用官方 upload-pages-artifact + deploy-pages，Source 应改选 GitHub Actions。</text>
