<rect x="0" y="0" width="1280" height="570" rx="0" fill="#F0F5F4" stroke="none" stroke-width="1"/>
<text x="58" y="72" fill="#153B45" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="37" font-weight="700" text-anchor="start" letter-spacing="0">Settings → Pages → Build and deployment</text>
<text x="58" y="110" fill="#66818A" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="500" text-anchor="start" letter-spacing="0">本站现有的 gh-pages 分支发布方案</text>
<rect x="55" y="145" width="1170" height="358" rx="20" fill="#FFFFFF" stroke="none" stroke-width="1" filter="url(#shadow)"/>
