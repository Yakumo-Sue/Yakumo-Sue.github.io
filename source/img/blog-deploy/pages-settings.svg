<text x="90" y="297" fill="#334E57" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0">Branch</text>
<rect x="310" y="259" width="490" height="58" rx="10" fill="#E9F2F1" stroke="#C8DDDC" stroke-width="1"/>
