title: 八云家的记事簿
subtitle: 山川远阔，记录皆是热爱。
description: 关于技术、阅读、生活，以及一切微小而美好的事。
keywords: 八云, 博客, 记录, 阅读, 生活
author: 八云
language: zh-CN
timezone: Asia/Shanghai

url: https://yakumo-sue.github.io
root: /
permalink: posts/:title/
permalink_defaults: {}
pretty_urls:
  trailing_index: true
  trailing_html: true
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: []
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: false
highlight:
  enable: false
prismjs:
  enable: false
index_generator:
  per_page: 8
  order_by: -date
per_page: 10
pagination_dir: page
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date
feed:
  enable: true
  type: rss2
  path: feed.xml
  limit: 20
  autodiscovery: true
theme: fluid
